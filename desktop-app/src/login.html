<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>GroupBuy - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e1e5eb;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input::placeholder {
      color: #adb5bd;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .products-section {
      display: none;
    }

    .products-section.show {
      display: block;
    }

    .product-list {
      margin-bottom: 20px;
    }

    .product-item {
      display: flex;
      align-items: center;
      padding: 16px;
      border: 2px solid #e1e5eb;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-item:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .product-item.selected {
      border-color: #667eea;
      background: #f0f3ff;
    }

    .product-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      overflow: hidden;
    }

    .product-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .product-info p {
      font-size: 13px;
      color: #6b7280;
    }

    .back-link {
      display: inline-block;
      color: #667eea;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #e1e5eb;
    }

    .footer p {
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>GroupBuy</h1>
      <p>Secure access to your subscriptions</p>
    </div>

    <div class="content">
      <!-- Login Section -->
      <div id="loginSection">
        <div id="errorMessage" class="error-message"></div>
        
        <div class="form-group">
          <label for="accessCode">Access Code</label>
          <input 
            type="text" 
            id="accessCode" 
            placeholder="Enter your access code (e.g., GB-XXXXXXXX)"
            autocomplete="off"
          >
        </div>

        <button id="verifyBtn" class="btn btn-primary">
          Verify Access Code
        </button>
      </div>

      <!-- Products Section -->
      <div id="productsSection" class="products-section">
        <span class="back-link" id="backBtn">&larr; Back</span>
        
        <div id="errorMessage2" class="error-message"></div>
        
        <h3 style="margin-bottom: 16px; font-size: 16px; color: #333;">Select a product to access:</h3>
        
        <div id="productList" class="product-list"></div>

        <button id="launchBtn" class="btn btn-primary" disabled>
          Launch Product
        </button>
      </div>
    </div>

    <div class="footer">
      <p>Secure desktop application v1.0.0</p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
